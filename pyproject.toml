[project]
name = "charruallm"
version = "0.1.0"
description = "Tiny LLM base model trained on Uruguayan Spanish news"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "tokenizers>=0.20",
    "tqdm>=4.66",
    "transformers>=5.13.0",
    "pandas>=2.3.3",
    "matplotlib>=3.10.9",
    "scikit-learn>=1.7.2",
]

[tool.uv]
package = false
